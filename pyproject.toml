[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trybox"
version = "0.1.0"
description = "One command to a sandboxed AI coding experiment on a Mac"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brad Dougherty" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
trybox = "trybox.cli:main"

[tool.setuptools]
packages = ["trybox"]
