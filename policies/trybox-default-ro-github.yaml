# trybox default policy.
#
# Applies to a new sandbox at creation time via `openshell sandbox create
# --policy`, or to a running sandbox via `openshell policy set`.
#
# What it allows:
#   - filesystem: standard read-only system paths + /sandbox (the try dir)
#   - network: HTTPS GET/HEAD to github.com + raw content + codeload + objects
#     (clone/fetch work; push/POST/PATCH is blocked by "read-only" access preset)
#   - network: HTTPS GET to pypi/files.pythonhosted + registry.npmjs (packages)
# Everything else on the network is denied.

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]

landlock:
  compatibility: best_effort

network_policies:
  github_readonly:
    name: github-readonly
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/git }
      - { path: /usr/lib/git-core/git-remote-http }
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: raw.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: codeload.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: objects.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only

  pypi_readonly:
    name: pypi-readonly
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3.11 }
      - { path: /usr/local/bin/python3.12 }
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only

  npm_readonly:
    name: npm-readonly
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/node }
      - { path: /usr/local/bin/node }
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
